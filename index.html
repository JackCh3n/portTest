<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Test Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .status {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status code {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
        }
        .info { color: #888; font-size: 0.9em; }
        .links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .links a {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 8px;
            background: #f0f0f0;
            color: #667eea;
            text-decoration: none;
            font-size: 0.85em;
            transition: background 0.2s;
        }
        .links a:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Port Test Tool</h1>
        <p class="subtitle">端口测试工具运行成功</p>
        <div class="status">
            <p>服务状态: <code>RUNNING</code></p>
            <p>时间: <span id="time"></span></p>
        </div>
        <div class="links">
            <a href="/health">/health 健康检查</a>
            <a href="/info">/info 服务信息</a>
            <a href="/echo">/echo 请求回显</a>
        </div>
        <p class="info" style="margin-top: 16px;">此页面由 port-test 工具自动生成</p>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
