name: Build Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# 显式授予写权限，否则默认 GITHUB_TOKEN 无法创建 Release（403）
permissions:
  contents: write

jobs:
  # PR 质量门禁：vet + test（不构建矩阵，节省资源）
  pr-check:
    name: PR Check (vet + test)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.notes }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: "386"
            ext: .exe
            notes: -x86
          - os: windows
            arch: arm64
            ext: .exe

          # Linux x86/x64
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: "386"
            ext: ""
            notes: -x86

          # Linux ARM
          - os: linux
            arch: arm64
            ext: ""
          - os: linux
            arch: arm
            ext: ""

          # Linux MIPS (国产芯片支持)
          - os: linux
            arch: mips64
            ext: ""
          - os: linux
            arch: mips64le
            ext: ""
          - os: linux
            arch: mips
            ext: ""
          - os: linux
            arch: mipsle
            ext: ""

          # Linux LoongArch (龙芯)
          - os: linux
            arch: loong64
            ext: ""

          # macOS
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""

          # FreeBSD
          - os: freebsd
            arch: amd64
            ext: ""
          - os: freebsd
            arch: arm64
            ext: ""

          # OpenBSD
          - os: openbsd
            arch: amd64
            ext: ""

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        output_name="port-test-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.notes }}${{ matrix.ext }}"
        go build -trimpath -ldflags="-s -w" -o "$output_name" .
        echo "Built: $output_name"
        ls -lh "$output_name"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: port-test-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.notes }}
        path: port-test-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.notes }}${{ matrix.ext }}
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      env:
        TZ: Asia/Shanghai
      run: |
        if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
          echo "version=v$(date +'%Y_%m%d')" >> $GITHUB_OUTPUT
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: List release assets
      run: ls -lh dist/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        files: dist/*
        draft: false
        prerelease: false
        generate_release_notes: true
        # v2 默认行为: 同名 release 已存在时直接更新(无需 allow_update,
        # 该参数 v2 不支持会触发 Unexpected input 警告)
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
